name: QA

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax check
        run: npm run check:js

      - name: Data validation
        run: npm run check:data

      - name: Unit tests
        run: npm run test:unit
